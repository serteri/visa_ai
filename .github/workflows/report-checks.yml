name: Report checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-report-tests:
    runs-on: ubuntu-latest
    env:
      # Build-time only: prisma generate needs a syntactically valid
      # DATABASE_URL to run, but nothing in this job makes a real database
      # connection -- runReadinessEngine/generateReadinessPDF and the fee-
      # provenance checks are pure functions over in-repo data.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy?sslmode=disable"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Whole-repo `npm run lint` is intentionally NOT gated here: this
      # repo currently has ~120 pre-existing eslint errors unrelated to the
      # report/fee-consistency work this workflow guards (old scripts,
      # src/lib/readiness-engine.ts, etc.) -- gating on it would make this
      # workflow permanently red for reasons unrelated to any given PR.
      # Lint is checked manually, scoped to changed files, per change.

      - name: Report consistency tests (FAQ/Guide/Financial Roadmap agreement + banned-string regression, en/tr/zh-Hans)
        run: npm run test:report-consistency

      - name: Fee/threshold provenance and duplicate-definition tests
        run: npm run test:fee-provenance

      # Calls the real route handler production serves the PDF from
      # (app/api/reports/[reportId]/pdf/route.ts, DB layer stubbed), extracts
      # text + geometry from the returned bytes, and fails on banned strings,
      # a clipped EOI banner, or a Financial Roadmap without a total row. Also: the CPA Australia fee follows the
      # applicant's current country (offshore AUD 514, Australia AUD 565, Singapore AUD 560), and an Occupational
      # Therapist's PDF names the Occupational Therapy Council of Australia, not Occupational Therapy Australia.
      # The 5 occupations the page and report used to disagree on (221213, 222211, 232112, 322311, 342111) name
      # the Home Affairs-listed authority in the PDF.
      # Engineers Australia and AIMS fees from their extracted tables appear in the PDF (en/tr/zh-Hans); 311213 / 311216
      # name AIMS, 231113 VETASSESS, and a CASA pilot's PDF says "around 14 days".
      # The roadmap's skills-assessment sentence reads as one clean label (no "((by Assessing Authority))" or
      # "技能评估（技能评估 — ...）"), and TRA occupations its guidelines put on OSAP are quoted the OSAP fee, not AUD 795.
      - name: PDF route-handler tests (banned strings, banner clipping, Roadmap total row; en/tr/zh-Hans)
        run: npm run test:pdf-route

      # Report access control, through the real unlock server action, PDF route and result page (request context,
      # Prisma and /api/checkout stubbed): a TYPED admin email without a session never unlocks; an admin session
      # does; the PDF and the full result view need the report's access token, an admin session or the owner's
      # own session -- the report id alone is refused.
      - name: Report access control (admin unlock needs a session; PDF / result page need authorization)
        run: npm run test:report-access

      # Free admin orders (ADMINFREE promotion code, or an ADMIN_EMAILS / KNOWN_TEST_EMAILS address) must send
      # no report email, internal or customer; normal and other-discount orders send both as before. Runs the
      # real Stripe webhook handler with Resend, Stripe and Prisma stubbed (fake keys, no network, no DB).
      - name: Free-admin-order email suppression tests (stubbed sender)
        run: npm run test:email-suppression

      # Real occupation <-> state occupation-list matching (lib/state-nomination/occupation-match.ts) over
      # the git-committed src/data/state-occupation-lists/*.json -- pure data/function tests, no database.
      - name: Occupation <-> state occupation-list match tests
        run: npm run test:occupation-match

      # Medical registration data (src/data/health-registration/*.json, extracted from the Medical Board / Ahpra
      # "Pathways to registration for international medical graduates" document). The regenerate-and-diff drift
      # check needs the gitignored source PDF and is SKIPPED here; the committed-file invariants (fee schedule
      # shape and arithmetic, no amount on any deferred AMC/ECFMG/college fee, provenance coverage) always run.
      - name: IMG registration pathways data (drift + invariants)
        run: npm run test:img-pathways

      # Nursing skills assessment fees (src/data/health-registration/anmac-fees.json, extracted from Anmac.pdf).
      # The regenerate-and-diff drift check needs the gitignored source PDF and is SKIPPED here; the committed-file
      # invariants (the four stated fees with page + quote, the 6–8 week wait, the unpriced NMBA international
      # application/registration fees, the mapping of all 15 ANMAC occupations) always run.
      - name: ANMAC nursing skills assessment fees (drift + invariants)
        run: npm run test:anmac-fees

      # CA ANZ skills assessment fees (src/data/skills-assessment/caanz-fees.json, extracted from CA ANZ's own document).
      # The regenerate-and-diff drift check needs the gitignored source PDF and is SKIPPED here; the committed-file
      # invariants (the 12 fee-table rows with page + quote, 1 July 2026 effective date, no location variants, the six
      # occupations, and caanz.ts carrying only these figures -- none of the CPA figures it used to copy) always run.
      - name: CA ANZ skills assessment fees (drift + invariants)
        run: npm run test:caanz-fees

      # Engineers Australia (2026-2027 fee tables, by pathway and add-on, excl./incl. GST), AIMS (fee table p.18-19,
      # outside/within Australia) and ADC (the document states no amount -- recorded as "needs human verification").
      # The regenerate-and-diff drift checks need the gitignored source PDFs and are SKIPPED here; the committed-file
      # invariants (rows with pages and quotes, the registry carrying only extracted figures, the Home Affairs
      # occupation moves, 311213/311216 -> AIMS, CASA "around 14 days" and 231113 -> VETASSESS) always run.
      - name: Engineers Australia skills assessment fees (drift + invariants)
        run: npm run test:engineers-australia-fees

      - name: AIMS skills assessment fees (drift + invariants)
        run: npm run test:aims-fees

      - name: ADC skills assessment (drift + invariants; no amount stated) and CASA scope
        run: npm run test:adc-fees

      # The free Skills Assessment Finder page reads src/data/assessing-bodies.json, not the report's data. Its
      # ANMAC and Medical Board (doctor) fees must equal the report's sourced figures, compared against the report's
      # own modules (lib/health-registration/anmac-fees.ts, img-pathways.ts); ACS, TRA, CPA, CA ANZ, IPA, AACA and
      # OTC against the registry (lib/skills-assessment/authorities/*.ts) -- fails if the two ever drift. Also fails if any
      # occupation's assessing authority on the page differs from the one the report resolves (known older gaps listed).
      - name: Skills Assessment Finder page fees = report's sourced fees (ANMAC, Medical Board, ACS, TRA, CPA, CA ANZ, IPA, AACA, OTC)
        run: npm run test:tool-page-fees

      # REAL Stripe test mode (not stubbed): /api/stripe/checkout must create a Checkout Session for both
      # credit packages, and a session with the real ADMINFREE promotion code must go through the real webhook
      # handler with no email sent. Prisma/Resend/auth are stubbed, so nothing touches production. Needs the
      # STRIPE_TEST_SECRET_KEY repository secret (sk_test_ only); without it the step prints SKIPPED and passes.
      - name: Real Stripe test-mode checkout + ADMINFREE webhook suppression
        run: npm run test:stripe-real
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
